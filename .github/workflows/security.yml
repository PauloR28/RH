name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependencies-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pip-audit bandit
      - name: Auditoria de dependências
        run: pip-audit -r requirements.txt
      - name: SAST Python
        run: bandit -q -r apps/backend -x apps/backend/tests
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@v3

  javascript-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Escaneia apps/frontend/package-lock.json (dependências de dev/teste:
      # Playwright, Vite). O frontend em produção não tem bundler (CDN pinada
      # em apps/frontend/index.html) — ver achado SEC-015/QA-006 no programa
      # de evolução: acompanhamento de CVE das libs de runtime carregadas via
      # CDN (React, Bootstrap, SheetJS, JSZip) fica registrado como gap
      # conhecido, não coberto por este step.
      - name: SCA de dependências JavaScript (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0 (a tag v1 deixou de existir)
        with:
          scan-args: |-
            --lockfile=apps/frontend/package-lock.json
