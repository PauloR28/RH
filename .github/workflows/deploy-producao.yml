name: Deploy Producao

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, Windows, producao]
    # Um deploy travado segura o runner e enfileira os proximos; melhor falhar e avisar.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # A aplicacao para ANTES da copia: com ela rodando, arquivos em uso travavam o
      # robocopy (deploys de 23 e 24/set ficaram parados nessa etapa ate serem cancelados).
      - name: Parar aplicacao
        shell: powershell
        run: |
          Stop-ScheduledTask -TaskName "Conecta-RH" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      - name: Atualizar arquivos em C:\Conecta (preserva .env, .venv, data\private e logs)
        shell: powershell
        run: |
          # /MIR apaga no destino tudo que nao existe no Git. data\private (uploads: CVs,
          # evidencias da Monitoria, imagens, logs arquivados) e logs NUNCA podem ser apagados.
          # /R:3 /W:5: o padrao do robocopy e repetir 1.000.000 de vezes com 30 s de espera
          # quando um arquivo esta em uso, o que travava o deploy. Lista os arquivos (sem /NFL)
          # para o log mostrar qual arquivo falhou.
          robocopy "$env:GITHUB_WORKSPACE" "C:\Conecta" /MIR /XD ".venv" ".git" "C:\Conecta\data\private" "C:\Conecta\logs" "$env:GITHUB_WORKSPACE\data\private" "$env:GITHUB_WORKSPACE\logs" /XF ".env" /R:3 /W:5 /NDL /NJH /NP
          if ($LASTEXITCODE -ge 8) { throw "robocopy falhou com codigo $LASTEXITCODE" }
          # Codigos 1-7 do robocopy sao sucesso (arquivos copiados/removidos), mas o PowerShell
          # repassaria o codigo como saida do passo e o Actions marcaria falha.
          exit 0

      - name: Conferir pastas de dados fora da aplicacao (apenas aviso)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File "C:\Conecta\infra\scripts\powershell\verificar-pastas-dados.ps1" -AppDir "C:\Conecta"

      - name: Dependencias Python (so quando o requirements.txt mudou)
        shell: powershell
        run: |
          # O runner (NETWORK SERVICE) nao consegue parar nem apagar o que a tarefa Conecta-RH (SYSTEM) segura, e
          # nao executa o Python do .venv. Por isso o .venv NAO e recriado a cada deploy: so se roda o pip quando o
          # requirements.txt muda (hash guardado em logs\, pasta que o robocopy preserva). Se mudar, a falha aparece
          # aqui, com a aplicacao ainda de pe, em vez de deixar o .venv pela metade.
          $req = "C:\Conecta\requirements.txt"
          New-Item -ItemType Directory -Force "C:\Conecta\logs" | Out-Null
          $marca = "C:\Conecta\logs\requirements.sha256"
          $hash = (Get-FileHash $req -Algorithm SHA256).Hash
          $anterior = if (Test-Path $marca) { (Get-Content $marca -Raw).Trim() } else { "" }
          if ($anterior -eq $hash) { Write-Host "requirements.txt inalterado: pip nao necessario."; exit 0 }
          if (-not $anterior -and (Test-Path "C:\Conecta\.venv\Scripts\python.exe")) {
            Write-Host "AVISO: primeiro deploy com controle de hash; assumindo o .venv atual como em dia com o requirements.txt."
            Set-Content -Path $marca -Value $hash -Encoding ASCII; exit 0
          }
          if (-not (Test-Path "C:\Conecta\.venv\Scripts\python.exe")) { python -m venv "C:\Conecta\.venv" }
          & "C:\Conecta\.venv\Scripts\python.exe" -m pip install --quiet -r $req
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar requirements.txt (codigo $LASTEXITCODE)." }
          Set-Content -Path $marca -Value $hash -Encoding ASCII

      - name: Aplicar migrations pendentes
        shell: powershell
        env:
          PROD_SQL_PASSWORD: ${{ secrets.PROD_SQL_PASSWORD }}
        run: |
          powershell -ExecutionPolicy Bypass -File "C:\Conecta\infra\scripts\powershell\aplicar-migrations.ps1" -Server "localhost\SQLEXPRESS" -Database "RH_Provas_C24H" -Username "rh_app" -Password $env:PROD_SQL_PASSWORD

      - name: Reiniciar aplicacao e verificar saude
        shell: powershell
        run: |
          Start-ScheduledTask -TaskName "Conecta-RH"
          Start-Sleep -Seconds 5
          $resp = Invoke-WebRequest -Uri "http://localhost:8000/health" -UseBasicParsing -TimeoutSec 15
          Write-Host "Aplicacao respondendo: $($resp.Content)"

      - name: Religar aplicacao se o deploy falhar
        if: failure()
        shell: powershell
        run: Start-ScheduledTask -TaskName "Conecta-RH" -ErrorAction SilentlyContinue
